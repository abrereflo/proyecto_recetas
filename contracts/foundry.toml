[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
# Warnings are not tolerated in a contract that anchors clinical records.
deny_warnings = false
fs_permissions = [{ access = "read", path = "./out" }]

# Two compilers, on purpose. Everything this project writes is pinned to
# 0.8.24, exactly as the former `solc_version` key did, because a floating
# compiler means a contract that anchors clinical records cannot be rebuilt
# byte for byte. EAS v1.2.0 pins `pragma solidity 0.8.19` in `EAS.sol` and
# `SchemaRegistry.sol`, so a single global pin cannot compile both; a file and
# its imports must share one compiler, which is also why DeployEAS.s.sol and
# RegisterSchemas.s.sol are `^0.8.19` and never import `LocalDemo.sol`.
[[profile.default.compilation_restrictions]]
paths = "src/**"
version = "=0.8.24"

[[profile.default.compilation_restrictions]]
paths = "test/**"
version = "=0.8.24"

[[profile.default.compilation_restrictions]]
paths = "script/Deploy.s.sol"
version = "=0.8.24"

[[profile.default.compilation_restrictions]]
paths = "script/LocalDemo.sol"
version = "=0.8.24"

[[profile.default.compilation_restrictions]]
paths = "script/SetupCredentials.s.sol"
version = "=0.8.24"

# IssueCredential.s.sol imports BOTH sides: `src/PrescriptionRegistry.sol`, which
# is pinned above at 0.8.24, and `@eas/IEAS.sol`. It can be pinned at 0.8.24 —
# unlike DeployEAS.s.sol and RegisterSchemas.s.sol, which are left unrestricted
# at `^0.8.19` — because it imports only EAS *interfaces* (`IEAS.sol`,
# `Common.sol`, `ISchemaRegistry.sol`, `resolver/ISchemaResolver.sol`), and every
# one of those declares a floating `pragma solidity ^0.8.0`. The two files that
# force 0.8.19 are the implementations, `EAS.sol` and `SchemaRegistry.sol`, and
# this script never reaches them.
[[profile.default.compilation_restrictions]]
paths = "script/IssueCredential.s.sol"
version = "=0.8.24"


[profile.ci]
verbosity = 3
fuzz = { runs = 1024 }

[fuzz]
runs = 256

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
anvil = "${RPC_URL}"
fuji = "${FUJI_RPC_URL}"

# Avalanche Fuji is a paid tier on Etherscan V2, so the free Etherscan key does
# NOT verify here. Verification goes through Routescan, which exposes an
# Etherscan-compatible API and takes the literal string "verifyContract" as its
# key. The equivalent explicit invocation, for when the table below is not
# picked up, is:
#
#   forge verify-contract <address> <contract> --chain 43113 \
#     --verifier-url 'https://api.routescan.io/v2/network/testnet/evm/43113/etherscan' \
#     --etherscan-api-key verifyContract
#
# CONFIRMED on the first Fuji deployment (13/09/2026): the entry below works as
# written, the literal "verifyContract" key included. `forge script --verify`
# submitted the source, the job sat "Pending in queue" for roughly fifteen
# seconds and then returned "Pass - Verified". Forge also submits to Sourcify in
# parallel on its own. Both testnet.snowtrace.io and the Routescan explorer
# serve the verified source, because Snowtrace is Routescan-powered today.
[etherscan]
fuji = { key = "${ROUTESCAN_API_KEY}", chain = 43113, url = "https://api.routescan.io/v2/network/testnet/evm/43113/etherscan" }
