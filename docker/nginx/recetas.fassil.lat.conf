# ---------------------------------------------------------------------------
# HOST nginx vhost for recetas.fassil.lat — the doctor SPA plus the API.
#
# This file is NOT used inside any container. It belongs to the nginx that runs
# on the host at 203.161.56.37 (nginx/1.24.0, Ubuntu), the same nginx that
# already serves fassil.lat. It is kept in the repository so the reverse-proxy
# configuration is versioned next to the compose file it points at; on the
# server it is copied to /etc/nginx/sites-available/recetas.fassil.lat.conf and
# symlinked into sites-enabled/. See docs/19-despliegue.md.
#
# ---------------------------------------------------------------------------
# THIS IS THE PRE-CERTBOT FORM: port 80 only.
#
# Install it exactly as written, reload nginx, and then run certbot --nginx for
# this hostname. Certbot rewrites this file in place: it adds a `listen 443
# ssl` server block with the ssl_certificate paths it just issued, and turns
# this port-80 block into a 301 redirect to https. Do not hand-write those
# paths here — a certificate path that does not exist yet makes `nginx -t`
# fail, which takes the ALREADY RUNNING fassil.lat site down with it on the
# next reload.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name recetas.fassil.lat;

    # The API accepts request bodies up to 2 MB (`bodyLimit: 2_000_000` in
    # services/api/src/app.ts) because a prescription POST carries an encrypted
    # payload. nginx defaults client_max_body_size to 1m, so without this line
    # the proxy would reject valid prescriptions with a 413 before the API ever
    # saw them — and the error would look like a backend failure, not a proxy
    # limit. Kept at the same 2 MB so exactly one component decides what is too
    # big, and it is the one that knows.
    client_max_body_size 2m;

    # --- API -----------------------------------------------------------------
    # The trailing slash on proxy_pass is LOAD-BEARING. With it, nginx replaces
    # the matched `/api/` prefix with `/` before forwarding, so a browser
    # request for /api/prescriptions arrives at the container as /prescriptions.
    # That is required: this API registers its routes at the root (/health,
    # /prescriptions, /relayer — see services/api/src/routes/) and has no
    # internal /api prefix. Drop the slash and every request 404s. This is the
    # nginx equivalent of the Traefik stripprefix middleware this deployment
    # used to rely on.
    location /api/ {
        proxy_pass http://127.0.0.1:3100/;

        proxy_http_version 1.1;

        # Host carries the public name so the API sees the origin the browser
        # actually used, not 127.0.0.1.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme is correct rather than a hardcoded https: certbot copies
        # these headers into the 443 block it generates, where $scheme is
        # https, and leaves this port-80 block as a redirect that forwards
        # nothing.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # --- Doctor SPA ----------------------------------------------------------
    # NO trailing slash here, deliberately: the request URI must reach the
    # container unchanged so the SPA's own nginx can apply its `try_files`
    # fallback and its asset cache rules (docker/nginx/nginx.prod.conf). This
    # block is a pure pass-through — it adds no caching, no expires, no
    # add_header of its own, because the container already decides all of that
    # and a second opinion here would only be able to make it wrong.
    location / {
        proxy_pass http://127.0.0.1:8181;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
