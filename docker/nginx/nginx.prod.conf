# ---------------------------------------------------------------------------
# Shared nginx config for both production SPA images (doctor, pharmacy).
#
# The pharmacy app is a PWA with a service worker (apps/pharmacy/public/sw.js)
# that precaches the app shell. A browser only learns about a new deploy by
# re-fetching sw.js and byte-comparing it — if sw.js itself were served with
# the same long-lived cache as the hashed assets below, that fetch would keep
# returning the OLD file from cache forever, and the update check could never
# fire. manifest.webmanifest has the same problem (icons, name, start_url).
# Both must always be revalidated against the origin. This same file is reused
# for the doctor image, which has no service worker, so that extra rule is
# simply inert there.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite fingerprints filenames) — safe to cache forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker and PWA manifest must never be cached (see comment above).
    # Exact-match (`location =`) locations take priority over the regex block
    # above, so these two win even though .js also matches it.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }
}
