# ---------------------------------------------------------------------------
# HOST nginx vhost for farmacia.fassil.lat — the pharmacy PWA.
#
# This file is NOT used inside any container. It belongs to the nginx that runs
# on the host at 203.161.56.37 (nginx/1.24.0, Ubuntu), the same nginx that
# already serves fassil.lat. On the server it is copied to
# /etc/nginx/sites-available/farmacia.fassil.lat.conf and symlinked into
# sites-enabled/. See docs/19-despliegue.md.
#
# Why a hostname of its own instead of a path under recetas.fassil.lat: a
# service worker's scope is bound to the origin that served it
# (apps/pharmacy/public/sw.js). Sharing an origin with the doctor SPA would let
# this service worker intercept the other app's navigations and make both
# compete for the same browser cache storage.
#
# ---------------------------------------------------------------------------
# THIS IS THE PRE-CERTBOT FORM: port 80 only.
#
# Install it as written, reload nginx, then run certbot --nginx for this
# hostname. Certbot adds the `listen 443 ssl` block with its own certificate
# paths and converts this block into a 301 to https. Do not hand-write
# certificate paths here: a path that does not exist yet fails `nginx -t`, and
# a failed config takes the already-running fassil.lat site down on the next
# reload.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name farmacia.fassil.lat;

    # --- Pharmacy PWA --------------------------------------------------------
    # NO trailing slash on proxy_pass: the request URI reaches the container
    # unchanged so the image's own nginx (docker/nginx/nginx.prod.conf) can
    # apply its SPA `try_files` fallback and its cache rules.
    #
    # This block adds NO caching of its own, and that is a requirement, not an
    # omission. The container already serves /sw.js and /manifest.webmanifest
    # with `Cache-Control: no-cache` precisely so a browser re-fetches and
    # byte-compares sw.js on every visit — that comparison is the only way it
    # ever learns a new version was deployed. Any `expires`, `add_header
    # Cache-Control`, or `proxy_cache` here would override or shadow that and
    # pin every client to whatever service worker it installed first, with no
    # way to push an update short of telling users to clear site data. So:
    # pure pass-through, no cache directives, ever.
    location / {
        proxy_pass http://127.0.0.1:8182;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
