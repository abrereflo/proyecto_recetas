# ---------------------------------------------------------------------------
# Production deployment.
#
# Deployed to server1.fassil.lat (203.161.56.37), a machine that is ALREADY IN
# PRODUCTION for several unrelated businesses: fassil.lat itself plus more than
# twenty containers behind sibling vhosts (crm360, admingym, adminvoz-store,
# restaurante, pos-system, ...). That machine runs nginx (1.24.0, Ubuntu)
# directly on the host — NOT in a container, and NOT Traefik — and that host
# nginx terminates TLS for every one of those sites. This compose file must
# never take port 80 or 443, and never touch the host nginx config: everything
# already there has to keep serving throughout.
#
# So the split of responsibilities is:
#
#   * This file runs the containers and publishes each public one on a
#     LOOPBACK-ONLY host port (127.0.0.1:<port>). Nothing here is reachable
#     from the internet on its own.
#   * The host nginx is the reverse proxy: it owns 80/443, holds the
#     certificates, and proxies recetas.fassil.lat and farmacia.fassil.lat to
#     those loopback ports. The two vhosts live in docker/nginx/ in this
#     repository and are copied into /etc/nginx/sites-available on the server.
#   * certbot --nginx issues and renews the certificates for both hostnames.
#
# See docs/19-despliegue.md for the server-side procedure.
#
# No Anvil here: production points at Avalanche Fuji (chainId 43113). Anvil is
# the local development chain only (see docker-compose.yml).
#
# Two public hostnames instead of one: the pharmacy app is a PWA with a service
# worker (apps/pharmacy/public/sw.js), and a service worker's scope is bound to
# the origin that served it, so it needs its own hostname, separate from the
# doctor SPA.
#
# Memory caps on every service, and they are not a formality. Measured on the
# server: 5.8 GiB total, ~3.4 GiB already in use by the other businesses'
# containers, ~2.4 GiB available, and NO SWAP AT ALL. This stack asks for a
# 704 MB ceiling (256 + 320 + 64 + 64) out of that 2.4 GiB. mem_limit is a cap,
# not a reservation, so the real cost is lower — but with zero swap a memory
# spike does not page out, it invokes the OOM killer, and the OOM killer is
# free to pick a container belonging to someone else's live business. Swap must
# be configured on the host BEFORE the first deploy; docs/19-despliegue.md
# carries the procedure, and it is a human step because it needs sudo.
# No cpus cap: nothing here is CPU-bound and a wrong limit only adds throttling.
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: recetas-postgres
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recetas-network
    # No published port at all — not even on loopback. Postgres is reached only
    # by the api container, over the internal network. Do not add a `ports:`
    # entry here to "make psql easier": the correct way in is
    # `docker compose exec db psql`.

  api:
    # RECETAS_IMAGE_TAG pins this deploy to an immutable per-commit build
    # (sha-<gitsha>, pushed by the CI build jobs) so the running image is
    # reproducible and rollback-able. The :-latest default preserves the prior
    # behavior for any manual `docker compose` invocation with the var unset.
    # GHCR_OWNER is the GitHub account that owns this repository and therefore
    # owns the packages CI publishes: GITHUB_TOKEN can only write under its own
    # owner's namespace. Required with no default on purpose — an unset
    # variable would expand to the empty string and build `ghcr.io//recetas-api`,
    # which fails at the registry with an error that names nothing.
    image: "ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required (the GitHub account that owns this repository), e.g. abrereflo}/recetas-api:${RECETAS_IMAGE_TAG:-latest}"
    container_name: recetas-api
    restart: unless-stopped
    mem_limit: 320m
    # env_file forwards every variable from /home/deploy/apps/recetas/.env to
    # the container (chain RPC, EAS addresses, LOG_LEVEL, etc). The explicit
    # environment block below OVERRIDES the values that differ inside the
    # Docker network (internal Postgres hostname) or that must never drift
    # from the hostnames the host nginx serves (NODE_ENV, CORS_ORIGIN).
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Pin CORS to the two public origins the host nginx serves.
      # Comma-separated list — see services/api/src/env.ts (parseCorsOrigins)
      # for the exact parsing contract. These are the browser-visible origins
      # (https://, no port): the loopback port below is an implementation
      # detail the browser never sees.
      CORS_ORIGIN: "https://recetas.fassil.lat,https://farmacia.fassil.lat"
    ports:
      # 127.0.0.1 is DELIBERATE and is the whole security boundary of this
      # deployment. Bound this way the port exists only on the loopback
      # interface, so the host nginx can proxy to it and nothing on the
      # internet can reach it — not even by IP, and not through a hostname
      # that skips the vhost. A plain "3100:3000" would publish it on every
      # interface and hand the world an unencrypted API on a high port,
      # bypassing TLS entirely. TLS is terminated by the host nginx, never
      # here: this container speaks plain HTTP and must stay unreachable
      # except through that proxy.
      #
      # The host-side numbers (3100/8181/8182) were checked free on the server
      # with `ss -tlnp` (listening there today: 22, 53, 80, 111, 443, 2222,
      # 3000, 3320, 8083, 8090, 8091, 14330, 18080). Re-check before changing
      # them: a collision here would fail to bind, or worse, shadow a port
      # another business is about to take.
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health > /dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - recetas-network

  doctor:
    image: "ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required (the GitHub account that owns this repository), e.g. abrereflo}/recetas-doctor:${RECETAS_IMAGE_TAG:-latest}"
    container_name: recetas-doctor
    restart: unless-stopped
    mem_limit: 64m
    ports:
      # Loopback-only, same reasoning as the api service above. The container
      # runs its own nginx (docker/nginx/nginx.prod.conf) with the SPA fallback
      # and the cache rules already in it; the host nginx in front of this port
      # only proxies, it does not repeat any of that.
      - "127.0.0.1:8181:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Deliberately not on recetas-network: the SPA images serve static files and
    # have no reason to be able to open a socket to Postgres. Compose puts them
    # on the project's default bridge network, which is all a published port
    # needs.

  pharmacy:
    image: "ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required (the GitHub account that owns this repository), e.g. abrereflo}/recetas-pharmacy:${RECETAS_IMAGE_TAG:-latest}"
    container_name: recetas-pharmacy
    restart: unless-stopped
    mem_limit: 64m
    ports:
      # Loopback-only, same reasoning as above. This image also serves
      # /sw.js and /manifest.webmanifest with `Cache-Control: no-cache`
      # (docker/nginx/nginx.prod.conf) — the host nginx must forward those
      # headers untouched or the PWA can never learn about a new deploy.
      - "127.0.0.1:8182:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:

networks:
  recetas-network:
    driver: bridge
